name: lending_nelson
description: "Offline-capable microfinance lending client for Android."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^16.0.0

  # Networking
  dio: ^5.9.0

  # Local Storage
  flutter_secure_storage: ^9.2.4
  sqflite: ^2.3.3
  path: ^1.9.0
  encrypt: ^5.0.3

  # Utilities
  uuid: ^4.5.1

  # Connectivity
  connectivity_plus: ^6.1.5

  # URL Launcher
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
