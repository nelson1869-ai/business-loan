name: lending_nelson
description: "Offline-capable microfinance lending client for Android."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^16.0.0

  # Networking
  dio: ^5.10.0

  # Local Storage
  flutter_secure_storage: ^9.2.4
  sqflite: ^2.3.3
  path: ^1.9.0
  encrypt: ^5.0.3

  # Utilities
  uuid: ^4.5.1
  file_picker: ^10.3.10

  # Connectivity
  connectivity_plus: ^6.1.5

  # URL Launcher
  url_launcher: ^6.3.1
  workmanager: ^0.9.0+3
  flutter_local_notifications: ^22.2.0
  local_auth: ^3.0.2
  image_picker: ^1.2.3
  image_cropper: ^12.2.1
  flutter_image_compress: ^2.5.1
  pdf: ^3.13.0
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  share_plus: ^12.0.2
  device_info_plus: ^12.4.0
  package_info_plus: ^9.0.1
  crypto: ^3.0.7
  timezone: ^0.11.1
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  firebase_crashlytics: ^5.2.6
  firebase_analytics: ^12.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
