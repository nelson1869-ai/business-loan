$kind: http-request
name: 'Update Loan Status (Admin)'
method: POST
url: '{{baseUrl}}/api/v1/admin/loans/{{loanId}}/status'
order: 3000
description: Update loan status and optionally set first installment due to today.
body:
  type: json
  content: |-
    {
      "status": "Overdue",
      "dueToday": false
    }
