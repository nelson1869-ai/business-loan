$kind: http-request
url: "{{baseUrl}}/api/v1/borrowers"
method: POST
body:
  type: json
  content: |-
    {
      "id": "{{$guid}}",
      "createdAt": "{{$isoTimestamp}}",
      "firstName": "Test",
      "lastName": "Borrower",
      "nationalId": "TEST-ID-001",
      "phone": "+639171234567",
      "dateOfBirth": "1990-01-15",
      "status": "Pending"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201 || pm.response.code === 200) {
          const json = pm.response.json();
          pm.collectionVariables.set('borrowerId', json.id);
      }
    language: text/javascript
order: 2000
