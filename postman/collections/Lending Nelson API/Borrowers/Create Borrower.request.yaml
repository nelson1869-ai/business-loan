$kind: http-request
url: "{{baseUrl}}/api/v1/borrowers"
method: POST
body:
  type: json
  content: |-
    {
      "full_name": "Test Borrower",
      "phone": "+639171234567",
      "national_id": "TEST-ID-001",
      "address": "123 Test St, Manila",
      "emergency_contact_name": "Emergency Contact",
      "emergency_contact_phone": "+639179876543"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201 || pm.response.code === 200) {
          const json = pm.response.json();
          pm.collectionVariables.set('borrowerId', json.id);
      }
    language: text/javascript
order: 2000
