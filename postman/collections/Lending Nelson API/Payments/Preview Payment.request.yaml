$kind: http-request
url: "{{baseUrl}}/api/v1/loans/{{loanId}}/payments/preview"
method: POST
body:
  type: json
  content: |-
    {
      "amount": "1000.00",
      "effectiveDate": "{{paymentDate}}",
      "installmentId": null
    }
scripts:
  - type: beforeRequest
    code: |-
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      pm.collectionVariables.set('paymentDate', `${yyyy}-${mm}-${dd}`);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Preview returns interest-first allocation', function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property('appliedToInterest');
          pm.expect(json).to.have.property('appliedToPrincipal');
          pm.expect(json).to.have.property('outstandingPrincipalAfter');
      });
    language: text/javascript
order: 1000
