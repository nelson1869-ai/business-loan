$kind: http-request
url: "{{baseUrl}}/api/v1/loans/{{loanId}}/payments/{{paymentId}}/reversal"
method: POST
body:
  type: json
  content: |-
    {
      "requestId": "{{$guid}}",
      "effectiveDate": "{{paymentDate}}",
      "reason": "Payment was made in error"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Payment reversed successfully', function () {
          const json = pm.response.json();
          pm.expect(json.status).to.eql('Reversed');
      });
    language: text/javascript
order: 4000
