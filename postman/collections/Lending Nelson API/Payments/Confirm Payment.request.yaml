$kind: http-request
name: Confirm Payment
method: POST
url: '{{baseUrl}}/api/v1/loans/{{loanId}}/payments'
order: 2000
description: Record an immutable payment ledger entry with interest-first allocation.
body:
  type: json
  content: |-
    {
      "requestId": "{{$guid}}",
      "amount": "1000.00",
      "effectiveDate": "{{paymentDate}}",
      "installmentId": null,
      "note": "Monthly payment"
    }
scripts:
  - type: prerequest
    language: text/javascript
    code: |-
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      pm.collectionVariables.set("paymentDate", `${yyyy}-${mm}-${dd}`);
  - type: afterResponse
    language: text/javascript
    code: |-
      if (pm.response.code === 201 || pm.response.code === 200) {
          const json = pm.response.json();
          pm.collectionVariables.set("paymentId", json.id);
      }
