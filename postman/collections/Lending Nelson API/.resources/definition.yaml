$kind: collection
name: Lending Nelson API
variables:
  - key: baseUrl
    value: 'http://localhost:8000'
  - key: accessToken
    value: ''
  - key: refreshToken
    value: ''
  - key: borrowerId
    value: ''
  - key: loanId
    value: ''
  - key: paymentId
    value: ''
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
