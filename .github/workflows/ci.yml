name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check code formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Flutter codebase
        run: flutter analyze

      - name: Run unit & widget tests with coverage
        run: flutter test --coverage

      - name: Create ephemeral CI release signing key
        run: |
          keytool -genkeypair -v -keystore /tmp/officer-ci.jks -storepass ci-test-password -keypass ci-test-password -alias upload -keyalg RSA -keysize 2048 -validity 1 -dname "CN=CI,OU=Test,O=Lending,C=PH"
          printf 'storePassword=ci-test-password\nkeyPassword=ci-test-password\nkeyAlias=upload\nstoreFile=/tmp/officer-ci.jks\n' > android/key.properties

      - name: Validate development APK flavor
        run: >-
          flutter build apk --debug --flavor development
          --dart-define=APP_ENV=development
          --dart-define=API_BASE_URL=http://10.0.2.2:8000
          --dart-define=LOCAL_BORROWER_OTP_ENABLED=true

      - name: Validate hardened production release APK
        run: >-
          flutter build apk --release --flavor production
          --dart-define=APP_ENV=production
          --dart-define=API_BASE_URL=https://api.example.invalid
          --dart-define=LOCAL_BORROWER_OTP_ENABLED=false
          --dart-define=DEBUG_LOGGING_ENABLED=false

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  borrower_flutter:
    name: Borrower Mobile Quality, Tests & APK Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/borrower_mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check code formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Borrower Flutter codebase
        run: flutter analyze

      - name: Run unit & widget tests
        run: flutter test

      - name: Create ephemeral CI release signing key
        run: |
          keytool -genkeypair -v -keystore /tmp/borrower-ci.jks -storepass ci-test-password -keypass ci-test-password -alias upload -keyalg RSA -keysize 2048 -validity 1 -dname "CN=CI,OU=Test,O=Lending,C=PH"
          printf 'storePassword=ci-test-password\nkeyPassword=ci-test-password\nkeyAlias=upload\nstoreFile=/tmp/borrower-ci.jks\n' > android/key.properties

      - name: Build Development APK
        run: >-
          flutter build apk --debug --flavor development
          --dart-define=API_BASE_URL=http://10.0.2.2:8000
          --dart-define=APP_ENV=development
          --dart-define=LOCAL_BORROWER_OTP_ENABLED=true

      - name: Validate hardened production release APK
        run: >-
          flutter build apk --release --flavor production
          --dart-define=APP_ENV=production
          --dart-define=API_BASE_URL=https://api.example.invalid
          --dart-define=LOCAL_BORROWER_OTP_ENABLED=false
          --dart-define=DEBUG_LOGGING_ENABLED=false

  backend:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: lending_nelson_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://postgres:test-only-password@localhost:5432/lending_nelson_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:test-only-password@localhost:5432/lending_nelson_test
      JWT_SECRET_KEY: ci-only-random-placeholder-0123456789abcdef
      CORS_ORIGINS: http://localhost
      AI_ENABLED: "false"
      AI_EXPLANATIONS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify package consistency
        run: python -m pip check

      - name: Lint with Ruff
        run: python -m ruff check .

      - name: Check formatting with Ruff
        run: python -m ruff format --check .

      - name: Type-check financial and security-critical services
        run: >-
          python -m mypy
          --cache-dir=.mypy-ci-cache
          app/features/loans/calculator.py
          app/features/accounting/service.py
          app/features/payments/service.py
          app/features/auth/service.py
          app/features/sync
          app/features/loan_policies/service.py
          app/features/approvals/service.py

      - name: Verify PostgreSQL service readiness
        run: |
          python -c "
          import os, asyncio, asyncpg
          url = os.environ['TEST_DATABASE_URL'].replace('postgresql+asyncpg://', 'postgresql://')
          async def check():
              for _ in range(15):
                  try:
                      conn = await asyncpg.connect(url)
                      await conn.close()
                      print('PostgreSQL service is ready.')
                      return
                  except Exception:
                      await asyncio.sleep(1)
              raise RuntimeError('PostgreSQL service failed to become ready')
          asyncio.run(check())
          "

      - name: Apply Alembic migrations
        run: alembic upgrade head

      - name: Verify Alembic schema drift
        run: alembic check

      - name: Run pytest suite with baseline coverage gate
        # Measured repository baseline is 68%. Ratchet this upward as the
        # integration-gated borrower/report/sync paths receive executable tests.
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=68

      - name: Verify FastAPI application factory
        run: python -c "from app.main import app; assert app.title"

      - name: Verify Alembic migration round-trip
        run: |
          alembic downgrade base
          alembic upgrade head
          alembic check

      - name: Validate n8n Workflows
        run: python ../scripts/validate_n8n_workflows.py

  security:
    name: Security Scans & Dependency Review
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Python dependency audit
        run: python -m pip_audit

      - name: Secret Scan with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency Review (Pull Request)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
