name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check code formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Flutter codebase
        run: flutter analyze

      - name: Run unit & widget tests with coverage
        run: flutter test --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  borrower_flutter:
    name: Borrower Mobile Quality, Tests & APK Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/borrower_mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check code formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Borrower Flutter codebase
        run: flutter analyze

      - name: Run unit & widget tests
        run: flutter test

      - name: Build Debug APK
        run: flutter build apk --debug --dart-define=API_BASE_URL=http://10.0.2.2:8000

  backend:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: lending_nelson_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://postgres:test-only-password@localhost:5432/lending_nelson_test
      JWT_SECRET_KEY: ci-only-random-placeholder-0123456789abcdef
      CORS_ORIGINS: http://localhost
      AI_ENABLED: "false"
      AI_EXPLANATIONS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify package consistency
        run: python -m pip check

      - name: Lint with Ruff
        run: python -m ruff check .

      - name: Check formatting with Ruff
        run: python -m ruff format --check .

      - name: Run pytest suite with coverage
        run: python -m pytest --cov=app --cov-report=term-missing

      - name: Verify FastAPI application factory
        run: python -c "from app.main import app; assert app.title"

      - name: Verify Alembic migration path
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check

      - name: Validate n8n Workflows
        run: python ../scripts/validate_n8n_workflows.py

  security:
    name: Security Scans & Dependency Review
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Python dependency audit
        run: python -m pip_audit

      - name: Secret Scan with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency Review (Pull Request)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
